name: QEMU USB Loopback Self-test (Linux + Windows host)

# Experimental: boots a minimal Ubuntu guest in QEMU that presents a QEMU-
# emulated USB serial device (0403:6001, bulk IN/OUT, always-plugged) directly
# to the GUEST's kernel. The FirmwareKit.Comm CLI is published self-contained
# for linux-x64, handed to the guest over the QEMU user-net gateway (host HTTP
# server on 10.0.2.2:8000) and run INSIDE the guest with the native (usbfs)
# and libusb backends - real enumeration, session open, GET_DESCRIPTOR and
# reads, with no physical USB hardware anywhere.
#
# Host coverage: Linux (KVM) and Windows (TCG). The earlier USB/IP loopback
# approach was dropped: the guest's usbip-host module could not be reliably
# provisioned ("unable to bind device on 1-1"), and cdrtfe's mkisofs.exe on
# Windows runners dies with STATUS_DLL_NOT_FOUND (0xC0000135), so the seed ISO
# is now built with pycdlib.
#
# Guest: Ubuntu noble cloud image via cloud-init (NoCloud cidata seed).
# cloud-init installs libusb, downloads the published CLI tarball, runs
# `apis`, `all-devices` (native+libusb) and the read-only `selftest`
# (open session, GET_DESCRIPTOR, short ReadExact; no writes/reset). Results
# are echoed to the serial console (host-side guest.log) and polled here.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  linux-host-loopback:
    name: Linux host - guest selftest via QEMU USB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install QEMU and libusb runtime
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 cloud-image-utils libusb-1.0-0

    - name: Download Ubuntu cloud image
      run: |
        curl -fL -o ubuntu.img https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
        qemu-img resize ubuntu.img 8G

    - name: Publish CLI for linux-x64 (self-contained)
      run: dotnet publish FirmwareKit.Comm.CLI -c Release -r linux-x64 --self-contained -o publish

    - name: Pack CLI and serve it over HTTP for the guest
      run: |
        tar czf publish.tar.gz -C publish .
        nohup python3 -m http.server 8000 --bind 127.0.0.1 > http.log 2>&1 &
        echo "HTTP_PID=$!" >> "$GITHUB_ENV"
        sleep 1

    - name: Prepare cloud-init seed (guest runs CLI selftest)
      run: |
        cat > user-data <<'EOF'
        #cloud-config
        users:
          - name: ubuntu
            sudo: ALL=(ALL) NOPASSWD:ALL
        package_update: true
        packages:
          - libusb-1.0-0
        # Mirror cloud-init output onto the serial console (host-side guest.log).
        output:
          all: '| tee -a /var/log/cloud-init-output.log /dev/console'
        runcmd:
          - 'curl -fsSL --retry 5 --retry-delay 2 -o /tmp/fkc.tgz http://10.0.2.2:8000/publish.tar.gz && mkdir -p /opt/fkc && tar xzf /tmp/fkc.tgz -C /opt/fkc && chmod -R a+rx /opt/fkc && echo "[selftest] download OK" || echo "[selftest] download FAILED"'
          - 'cd /opt/fkc && ./FirmwareKit.Comm.CLI apis > /tmp/apis.log 2>&1; echo "[selftest] apis rc=$?"; tail -5 /tmp/apis.log'
          - 'cd /opt/fkc && ./FirmwareKit.Comm.CLI all-devices --api native > /tmp/dev-native.log 2>&1; echo "[selftest] native rc=$?"; grep -m1 "vid=0x0403 pid=0x6001" /tmp/dev-native.log || true'
          - 'cd /opt/fkc && ./FirmwareKit.Comm.CLI all-devices --api libusb > /tmp/dev-libusb.log 2>&1; echo "[selftest] libusb rc=$?"; grep -m1 "vid=0x0403 pid=0x6001" /tmp/dev-libusb.log || true'
          - 'cd /opt/fkc && ./FirmwareKit.Comm.CLI selftest --api native --vid 0x0403 --pid 0x6001 > /tmp/st-native.log 2>&1; echo "[selftest] selftest-native rc=$?"; tail -15 /tmp/st-native.log'
          - 'cd /opt/fkc && ./FirmwareKit.Comm.CLI selftest --api libusb --vid 0x0403 --pid 0x6001 > /tmp/st-libusb.log 2>&1; echo "[selftest] selftest-libusb rc=$?"; tail -15 /tmp/st-libusb.log'
          - 'grep -q "vid=0x0403 pid=0x6001" /tmp/dev-native.log && grep -q "vid=0x0403 pid=0x6001" /tmp/dev-libusb.log && grep -q "PASS control transfer" /tmp/st-native.log && grep -q "PASS control transfer" /tmp/st-libusb.log && echo "[selftest] RESULT: PASS" || echo "[selftest] RESULT: FAIL"'
        EOF
        cloud-localds seed.img user-data

    - name: Boot guest with emulated usb-serial (background)
      run: |
        sudo qemu-system-x86_64 \
          -machine accel=kvm:tcg \
          -cpu max \
          -m 2048 -smp 2 \
          -drive file=ubuntu.img,if=virtio \
          -drive file=seed.img,if=virtio,format=raw \
          -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
          -device piix3-usb-uhci \
          -chardev null,id=usb0 \
          -device usb-serial,chardev=usb0,always-plugged=on \
          -display none -serial file:guest.log -monitor none > qemu.err 2>&1 &
        echo "QEMU_PID=$!" >> "$GITHUB_ENV"

    - name: Wait for guest selftest result
      run: |
        for i in $(seq 1 120); do
          if grep -q "\[selftest\] RESULT: PASS" guest.log 2>/dev/null; then
            echo "guest selftest PASSED after $((i * 5))s"
            grep "\[selftest\]" guest.log
            exit 0
          fi
          if grep -q "\[selftest\] RESULT: FAIL" guest.log 2>/dev/null; then
            echo "::error::guest selftest FAILED"
            grep -E '\[selftest\]|PASS control|FAIL control|SKIP|No devices|error' guest.log | tail -80
            exit 1
          fi
          # Periodic diagnostics: show guest provisioning progress.
          if [ $((i % 12)) -eq 0 ]; then
            echo "[debug] attempt $i ($((i * 5))s): guest markers:"
            grep -E '\[selftest\]|download|9p|mount|error|failed' guest.log 2>/dev/null | tail -30 || true
            tail -5 qemu.err 2>/dev/null || true
          fi
          sleep 5
        done
        echo "::error::guest selftest did not complete in time"
        tail -60 guest.log || true
        tail -10 qemu.err || true
        exit 1

    - name: Cleanup
      if: always()
      run: |
        sudo kill "$QEMU_PID" 2>/dev/null || true
        kill "$HTTP_PID" 2>/dev/null || true

  windows-host-loopback:
    name: Windows host - guest selftest via QEMU USB (TCG)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Setup Python (for seed ISO)
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install QEMU and pycdlib
      shell: powershell
      run: |
        choco install qemu -y --no-progress
        python -m pip install --disable-pip-version-check -q pycdlib

    - name: Download Ubuntu cloud image
      shell: powershell
      run: |
        curl.exe -fL -o ubuntu.img https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
        & 'C:\Program Files\qemu\qemu-img.exe' resize ubuntu.img 8G

    - name: Publish CLI for linux-x64 (self-contained)
      run: dotnet publish FirmwareKit.Comm.CLI -c Release -r linux-x64 --self-contained -o publish

    - name: Prepare cloud-init seed (guest runs CLI selftest)
      shell: powershell
      run: |
        $userData = @'
        #cloud-config
        users:
          - name: ubuntu
            sudo: ALL=(ALL) NOPASSWD:ALL
        package_update: true
        packages:
          - libusb-1.0-0
        # Mirror cloud-init output onto the serial console (host-side guest.log).
        output:
          all: '| tee -a /var/log/cloud-init-output.log /dev/console'
        runcmd:
          - 'curl -fsSL --retry 5 --retry-delay 2 -o /tmp/fkc.tgz http://10.0.2.2:8000/publish.tar.gz && mkdir -p /opt/fkc && tar xzf /tmp/fkc.tgz -C /opt/fkc && chmod -R a+rx /opt/fkc && echo "[selftest] download OK" || echo "[selftest] download FAILED"'
          - 'cd /opt/fkc && ./FirmwareKit.Comm.CLI apis > /tmp/apis.log 2>&1; echo "[selftest] apis rc=$?"; tail -5 /tmp/apis.log'
          - 'cd /opt/fkc && ./FirmwareKit.Comm.CLI all-devices --api native > /tmp/dev-native.log 2>&1; echo "[selftest] native rc=$?"; grep -m1 "vid=0x0403 pid=0x6001" /tmp/dev-native.log || true'
          - 'cd /opt/fkc && ./FirmwareKit.Comm.CLI all-devices --api libusb > /tmp/dev-libusb.log 2>&1; echo "[selftest] libusb rc=$?"; grep -m1 "vid=0x0403 pid=0x6001" /tmp/dev-libusb.log || true'
          - 'cd /opt/fkc && ./FirmwareKit.Comm.CLI selftest --api native --vid 0x0403 --pid 0x6001 > /tmp/st-native.log 2>&1; echo "[selftest] selftest-native rc=$?"; tail -15 /tmp/st-native.log'
          - 'cd /opt/fkc && ./FirmwareKit.Comm.CLI selftest --api libusb --vid 0x0403 --pid 0x6001 > /tmp/st-libusb.log 2>&1; echo "[selftest] selftest-libusb rc=$?"; tail -15 /tmp/st-libusb.log'
          - 'grep -q "vid=0x0403 pid=0x6001" /tmp/dev-native.log && grep -q "vid=0x0403 pid=0x6001" /tmp/dev-libusb.log && grep -q "PASS control transfer" /tmp/st-native.log && grep -q "PASS control transfer" /tmp/st-libusb.log && echo "[selftest] RESULT: PASS" || echo "[selftest] RESULT: FAIL"'
        '@
        # cloud-init rejects CRLF line endings; write UTF-8 with LF explicitly.
        $userData = $userData -replace "`r`n", "`n"
        [System.IO.File]::WriteAllText("$PWD\user-data", $userData, (New-Object System.Text.UTF8Encoding($false)))
        $metaData = @'
        instance-id: iid-local01
        local-hostname: fkc-guest
        '@
        $metaData = $metaData -replace "`r`n", "`n"
        [System.IO.File]::WriteAllText("$PWD\meta-data", $metaData, (New-Object System.Text.UTF8Encoding($false)))
        # Build the cidata ISO with pycdlib. cdrtfe's mkisofs.exe is unusable on
        # Windows runners (exits 0xC0000135 STATUS_DLL_NOT_FOUND).
        @'
        import io
        import os
        import pycdlib
        iso = pycdlib.PyCdlib()
        iso.new(interchange_level=3, joliet=3, rock_ridge='1.09', vol_ident='cidata')
        for src, iso_name, joliet, rr in (
            ('user-data', '/USERDATA.;1', '/user-data', 'user-data'),
            ('meta-data', '/METADATA.;1', '/meta-data', 'meta-data'),
        ):
            # pycdlib reads file contents lazily at iso.write(), so hand it an
            # in-memory buffer rather than a file handle that may close early.
            with open(src, 'rb') as f:
                data = f.read()
            iso.add_fp(io.BytesIO(data), len(data), iso_name, joliet_path=joliet, rr_name=rr)
        iso.write('seed.img')
        iso.close()
        print('[seed] seed.img written')
        '@ | Set-Content -Path make_seed.py -Encoding ascii
        python make_seed.py
        if ($LASTEXITCODE -ne 0) { throw "seed.img creation failed with exit code $LASTEXITCODE" }

    - name: Pack CLI and serve it over HTTP for the guest
      shell: powershell
      run: |
        tar.exe -czf publish.tar.gz -C publish .
        $p = Start-Process -FilePath python -ArgumentList '-m','http.server','8000','--bind','127.0.0.1' -PassThru -NoNewWindow -RedirectStandardOutput http.log -RedirectStandardError http.err
        "HTTP_PID=$($p.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
        Start-Sleep -Seconds 1

    - name: Boot guest with emulated usb-serial (background)
      shell: powershell
      run: |
        $p = Start-Process -FilePath 'C:\Program Files\qemu\qemu-system-x86_64.exe' -ArgumentList @(
          '-machine','accel=tcg',
          '-cpu','max',
          '-m','2048','-smp','2',
          '-drive','file=ubuntu.img,if=virtio',
          '-drive','file=seed.img,if=virtio,format=raw',
          '-netdev','user,id=n0','-device','virtio-net-pci,netdev=n0',
          '-device','piix3-usb-uhci',
          '-chardev','null,id=usb0',
          '-device','usb-serial,chardev=usb0,always-plugged=on',
          '-display','none','-serial','file:guest.log','-monitor','none'
        ) -PassThru -NoNewWindow -RedirectStandardError qemu.err
        "QEMU_PID=$($p.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Wait for guest selftest result
      shell: powershell
      run: |
        for ($i = 0; $i -lt 180; $i++) {
          if (Select-String -Path guest.log -Pattern '\[selftest\] RESULT: PASS' -Quiet -ErrorAction SilentlyContinue) {
            Write-Host "guest selftest PASSED after $($i * 5)s"
            Get-Content guest.log | Select-String -Pattern '\[selftest\]' | ForEach-Object { Write-Host $_.Line }
            exit 0
          }
          if (Select-String -Path guest.log -Pattern '\[selftest\] RESULT: FAIL' -Quiet -ErrorAction SilentlyContinue) {
            Write-Host '::error::guest selftest FAILED'
            Get-Content guest.log | Select-String -Pattern '\[selftest\]|PASS control|FAIL control|SKIP|No devices|error' | Select-Object -Last 80 | ForEach-Object { Write-Host $_.Line }
            exit 1
          }
          if ($i -gt 0 -and ($i % 24) -eq 0) {
            Write-Host "[debug] attempt $($i * 5)s: guest markers:"
            Get-Content guest.log -ErrorAction SilentlyContinue | Select-String -Pattern '\[selftest\]|download|9p|mount|error|failed' | Select-Object -Last 30 | ForEach-Object { Write-Host $_.Line }
          }
          Start-Sleep -Seconds 5
        }
        Write-Host '::error::guest selftest did not complete in time'
        Get-Content guest.log -Tail 60 -ErrorAction SilentlyContinue
        exit 1

    - name: Cleanup
      if: always()
      shell: powershell
      run: |
        Stop-Process -Id $env:QEMU_PID -Force -ErrorAction SilentlyContinue
        Stop-Process -Id $env:HTTP_PID -Force -ErrorAction SilentlyContinue
