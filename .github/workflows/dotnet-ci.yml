name: .NET CI/CD

# Device-less CI contract (GitHub-hosted runners expose NO physical USB devices):
#   HARD-GATE (must pass on every runner):
#     1. dotnet restore / build                   — solution builds
#     2. dotnet test                              — unit + integration tests pass
#     3. apis                                     — ≥1 backend registers
#     4. all-devices --json (native + libusb)     — enumeration exits 0; 0 devices is valid
#     5. repeated enumeration stability           — two consecutive passes match
#     6. enumeration mechanism ran                — [enum-diagnostics] line present
#     7. monitor 3 s hot-plug smoke               — runs the full 3 s window
#   SOFT-PATH (never fails CI — needs attached hardware):
#     selftest                                    — open session + GET_DESCRIPTOR + ReadExact
#
# The tools/test-*.sh / test-windows.ps1 scripts enforce the same contract end-to-end
# (build → tests → enumeration → monitor) and SKIP selftest when no matching device is
# attached. The smoke-script step below runs them per-platform; selftest SKIP/NOTE is
# the expected device-less outcome.
# <para>无设备 CI 契约（GitHub 托管 runner 不暴露物理 USB 设备）：
# 硬门（每个 runner 必须通过）：restore/build、dotnet test、apis、all-devices、重复枚举稳定性、
# 枚举机制运行、monitor 3 秒冒烟。
# 软路径（永不失败 CI——需附加硬件）：selftest。
# test-*.sh / test-windows.ps1 脚本端到端执行同一契约，selftest 在无设备时 SKIP/NOTE。</para>

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    # GitHub-hosted runners expose no physical USB devices. Providing the native libusb
    # runtime on Linux lets the libusb probe succeed and enumerate zero devices, which
    # exercises the "supported but no hardware" path.
    # The -dev package is required: the runtime package ships only the versioned soname
    # (libusb-1.0.so.0), while the library's DllImport("libusb-1.0") probe needs the
    # unversioned symlink (libusb-1.0.so) that only the -dev package provides.
    - name: Install libusb (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0 libusb-1.0-0-dev

    # The libusb backend probe (Marshal.Prelink) degrades gracefully when the native
    # runtime is absent. Windows reuses the repository's committed runtime
    # (native/win-x64/libusb-1.0.dll, the same artifact fetch-libusb.sh produces and the
    # nupkg packages) so the supported-but-no-hardware path is exercised there too.
    - name: Provision libusb runtime (Windows, repo artifact)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $libDir = Join-Path $env:GITHUB_WORKSPACE 'native\win-x64'
        Test-Path (Join-Path $libDir 'libusb-1.0.dll') | Should -BeTrue
        echo "$libDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8
        Write-Host "Added $libDir to PATH for libusb probe"

    # macOS: Homebrew's libusb installs to /opt/homebrew/lib (arm64) or /usr/local/lib
    # (x64), which is not in .NET's dlopen search path, so the probe would fail. Reuse the
    # repository's committed per-arch dylib (same artifact fetch-libusb.sh produces) and
    # expose it via DYLD_LIBRARY_PATH, mirroring the Windows PATH approach.
    - name: Provision libusb runtime (macOS, repo artifact)
      if: runner.os == 'macOS'
      run: |
        arch="$(uname -m)"
        case "$arch" in
          arm64)  libDir="native/macos-arm64" ;;
          x86_64) libDir="native/macos-x64" ;;
          *) echo "::error::unsupported macOS arch: $arch"; exit 1 ;;
        esac
        test -f "$libDir/libusb-1.0.dylib" || { echo "::error::missing $libDir/libusb-1.0.dylib"; exit 1; }
        echo "DYLD_LIBRARY_PATH=$GITHUB_WORKSPACE/$libDir" >> "$GITHUB_ENV"
        echo "Added $GITHUB_WORKSPACE/$libDir to DYLD_LIBRARY_PATH for libusb probe"

    # --- Stage 1: Build -----------------------------------------------------
    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    # --- Stage 2: Unit + integration tests (hard gate) ----------------------
    - name: Test
      run: dotnet test --no-build -c Release --verbosity normal

    # --- Stage 3: Backend API registration (hard gate) ----------------------
    # Every platform must register at least one backend API. An empty `apis` result
    # means the platform's native provider failed to initialize — a hard regression.
    # <para>每个平台必须注册至少一个后端 API。`apis` 结果为空意味着平台原生提供器
    # 初始化失败——硬回归。</para>
    - name: Backend APIs registered
      shell: bash
      run: |
        APIS="$(dotnet run --project FirmwareKit.Comm.CLI --no-build -c Release -- apis 2>&1)"
        echo "$APIS"
        if [ -z "$APIS" ]; then
          echo "::error::no backend APIs registered on $RUNNER_OS"
          exit 1
        fi

    # --- Stage 4: Enumeration mechanism ran (hard gate) ---------------------
    # On a healthy runner the backend's native enumeration entry point succeeds even
    # with zero devices attached. A silent failure (SetupDi failed / IOUSBLib copy
    # failed) fails the CI.
    # Linux: hosted runners may lack the usbfs mount (/dev/bus/usb); only assert
    # usbfs-root=True when the mount exists, otherwise just require the diagnostic.
    # macOS: hosted runners may lack IOUSBLib in the dyld cache; the finder degrades to
    # copy-devices=False with an empty result (no throw) — also acceptable as long as the
    # diagnostic is emitted.
    - name: Assert enumeration mechanism ran (native)
      shell: bash
      run: |
        OUT="$(dotnet run --project FirmwareKit.Comm.CLI --no-build -c Release -- all-devices --api native 2>&1 || true)"
        echo "$OUT"
        echo "$OUT" | grep -q "\[enum-diagnostics\]" || { echo "::error::missing [enum-diagnostics] line"; exit 1; }
        case "$RUNNER_OS" in
          Windows) echo "$OUT" | grep -q "setupdi-succeeded=True" || { echo "::error::SetupDi did not succeed on Windows"; exit 1; } ;;
          Linux)
            echo "$OUT" | grep -q "usbfs-root=" || { echo "::error::missing usbfs-root diagnostic on Linux"; exit 1; }
            if [ -d /dev/bus/usb ]; then
              echo "$OUT" | grep -q "usbfs-root=True" || { echo "::error::usbfs root present but finder reported False on Linux"; exit 1; }
            else
              echo "NOTE	usbfs not mounted on this runner; skipping usbfs-root=True assertion"
            fi
            ;;
          macOS)   echo "$OUT" | grep -q "copy-devices=" || { echo "::error::missing copy-devices diagnostic on macOS"; exit 1; } ;;
        esac

    # --- Stage 5: Enumeration stability (hard gate) -------------------------
    # Regression guard: the device set must be identical across two consecutive
    # enumeration passes. A device vanishing after the first pass is the feedback
    # issue this guard exists to catch.
    # <para>回归守护：连续两轮枚举的设备集合必须一致。首轮后设备消失正是本守护
    # 要捕获的反馈问题。</para>
    - name: Repeated enumeration stability (native)
      shell: bash
      run: |
        # The step shell runs under `set -e -o pipefail`. Capture each pass's real
        # exit code with `set +e` … `set -e`, so a non-zero `dotnet run` cannot
        # abort the script before RC1=$? records it (the `cmd || true; RC=$?` form
        # would leave $? as 0 and silently defeat the guard).
        # The --json output is pretty-printed, so "vid" and "pid" sit on separate
        # lines; the awk extractor below pairs them per device and exits 0 even
        # when no device is present — device-less runners must pass this guard
        # trivially, and a plain `grep` no-match would abort the step.
        # <para>步骤 shell 以 `set -e -o pipefail` 运行。用 `set +e`…`set -e` 捕获
        # 每轮真实的退出码，避免非零的 `dotnet run` 在 RC1=$? 记录前中止脚本
        # （`cmd || true; RC=$?` 会使 $? 恒为 0，静默失效守卫）。
        # `--json` 输出为美化缩进格式，"vid"/"pid" 分处两行；下方 awk 按设备配对提取，
        # 且在无设备时也以 0 退出——无设备 runner 必须平凡通过本守卫，而纯 `grep`
        # 无匹配会中止步骤。</para>
        set +e
        P1="$(dotnet run --project FirmwareKit.Comm.CLI --no-build -c Release -- all-devices --api native --json 2>&1)"; RC1=$?
        P2="$(dotnet run --project FirmwareKit.Comm.CLI --no-build -c Release -- all-devices --api native --json 2>&1)"; RC2=$?
        set -e
        if [ "$RC1" -ne 0 ] || [ "$RC2" -ne 0 ]; then
          echo "::error::enumeration pass exited non-zero (pass1=$RC1 pass2=$RC2)"
          exit 1
        fi
        S1="$(echo "$P1" | awk -F'"' '/"vid":/{v=$4} /"pid":/{print v":"$4}' | sort -u)"
        S2="$(echo "$P2" | awk -F'"' '/"vid":/{v=$4} /"pid":/{print v":"$4}' | sort -u)"
        if [ "$S1" != "$S2" ]; then
          echo "::error::enumeration device set changed between passes"
          echo "pass1: $S1"
          echo "pass2: $S2"
          exit 1
        fi
        echo "PASS repeated enumeration stable"

    # --- Stage 6: libusb backend probe (hard gate, no hardware) -------------
    # The libusb backend probe (Marshal.Prelink) degrades gracefully when the native
    # runtime is absent. Running it on hosted runners exercises the supported-but-
    # no-hardware path; a non-zero exit here is a regression.
    # <para>libusb 后端探针在缺失原生运行库时优雅降级。在托管 runner 上运行以演练
    # "支持但无硬件"路径；此处非零退出即回归。</para>
    - name: Observe device enumeration (libusb)
      run: dotnet run --project FirmwareKit.Comm.CLI --no-build -c Release -- all-devices --api libusb

    # --- Stage 7: Smoke script (device-less, per-platform) ------------------
    # The tools/test-*.sh / test-windows.ps1 scripts run the full end-to-end path
    # used for real-device QA: build → tests → apis → all-devices → repeated
    # enumeration → selftest → monitor. On device-less hosted runners:
    #   - selftest reports SKIP (no matching device attached, exit 0)
    #   - monitor runs a 3 s hot-plug smoke
    # The scripts honor the device-less contract: build/tests/apis/all-devices/monitor
    # are hard-gated; selftest SKIP/NOTE is the expected device-less outcome and never
    # fails CI.
    # <para>tools/test-*.sh / test-windows.ps1 脚本端到端运行真实设备 QA 全路径。在无设备
    # 托管 runner 上：selftest 报告 SKIP（无匹配设备，退出码 0）；monitor 运行 3 秒冒烟。
    # 脚本遵循无设备契约：build/tests/apis/all-devices/monitor 为硬门；selftest SKIP/NOTE
    # 为无设备预期结果，永不失败 CI。</para>
    - name: Run smoke script (Windows, device-less)
      if: runner.os == 'Windows'
      shell: pwsh
      run: powershell -ExecutionPolicy Bypass -File tools/test-windows.ps1 -Api auto

    - name: Run smoke script (Linux, device-less)
      if: runner.os == 'Linux'
      run: bash tools/test-linux.sh --api auto

    - name: Run smoke script (macOS, device-less)
      if: runner.os == 'macOS'
      run: bash tools/test-macos.sh --api auto
